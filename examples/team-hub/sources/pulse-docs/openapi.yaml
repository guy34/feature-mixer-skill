openapi: 3.0.3
info:
  title: Pulse public API
  version: "2.0"
security:
  - oauth: []
paths:
  /v2/dashboard/workload:
    get:
      summary: Workload for the current workspace
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  open_by_person: { type: array }
                  overdue: { type: integer }
                  pending_approvals: { type: integer }
  /v2/push/subscriptions:
    post:
      summary: Register this browser for push notifications
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscription"
components:
  schemas:
    PushSubscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        endpoint: { type: string }
        created_at: { type: string, format: date-time }
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes: {}
